name: CIN Step 23 Storage Boundary Validation

on:
  push:
    branches:
      - test/cin-step23-sqlite-persistence-reliability
  pull_request:
    branches:
      - feat/cin-market-data-row-provenance
      - main

permissions:
  contents: read

jobs:
  storage-boundary:
    name: SQLite, store contract, and API boundary tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install API runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1" "pydantic>=2,<3"

      - name: Inspect packaged Render application entrypoint (read-only)
        run: |
          python -m zipfile -e cin_step203_scaffold_fixed.zip /tmp/cin-deployment-audit
          echo "Packaged application files:"
          find /tmp/cin-deployment-audit/cin -maxdepth 3 -type f | sort
          echo "Packaged app/main.py:"
          sed -n '1,260p' /tmp/cin-deployment-audit/cin/app/main.py
          python -m compileall -q /tmp/cin-deployment-audit/cin/app

      - name: Compile CIN modules and tests
        run: |
          python -m compileall -q tests
          python -m py_compile cin_evidence_store.py cin_local_sqlite_evidence_repository.py cin_evidence_ingestion_api.py cin_coinbase_public_market_data.py cin_coinbase_market_data_api.py

      - name: Run Coinbase public candle adapter tests
        run: python -m unittest discover -s tests -p "test_cin_coinbase_public_market_data.py" -v

      - name: Run Coinbase public candles API tests
        run: python -m unittest discover -s tests -p "test_cin_coinbase_market_data_api.py" -v

      - name: Run SQLite persistence reliability tests
        run: python -m unittest discover -s tests -p "test_cin_sqlite_persistence_reliability.py" -v

      - name: Run evidence store contract and identity lookup tests
        run: python -m unittest discover -s tests -p "test_cin_evidence_store_contract.py" -v

      - name: Run public evidence API storage boundary tests
        run: python -m unittest discover -s tests -p "test_cin_evidence_ingestion_api_storage_boundary.py" -v

      - name: Run evidence persistence orchestration tests
        run: python -m unittest discover -s tests -p "test_cin_evidence_persistence_orchestration.py" -v

      - name: Run real SQLite persistence integration tests
        run: python -m unittest discover -s tests -p "test_cin_evidence_persistence_sqlite_integration.py" -v

name: CIN Coinbase Backend Contract Tests

on:
  push:
    branches:
      - feat/cin-provider-row-accounting

permissions:
  contents: read

jobs:
  coinbase-backend-tests:
    name: Coinbase adapter and API offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal API test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi

      - name: Compile Coinbase adapter, API and tests
        run: |
          python -m py_compile cin_coinbase_public_market_data.py
          python -m py_compile cin_coinbase_market_data_api.py
          python -m py_compile tests/test_cin_coinbase_public_market_data.py
          python -m py_compile tests/test_cin_coinbase_market_data_api.py

      - name: Run Coinbase backend contract tests
        run: |
          python -m unittest -v \
            tests.test_cin_coinbase_public_market_data \
            tests.test_cin_coinbase_market_data_api

name: CIN evidence ingestion API checks

on:
  push:
    branches: [main, milestone-3-evidence-quality]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-evidence-api:
    name: Offline API safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependency
        run: python -m pip install "fastapi>=0.110,<1" "pydantic>=2,<3"
      - name: Compile API, provider, and contract tests
        run: python -m py_compile cin_evidence_ingestion.py cin_evidence_ingestion_api.py tests/test_public_evidence_ingestion_api.py tests/test_cin_evidence_ingestion_api.py tests/test_cin_evidence_ingestion.py
      - name: Run offline provider and API contract tests
        run: python -m unittest tests/test_cin_evidence_ingestion.py tests/test_cin_evidence_ingestion_api.py tests/test_public_evidence_ingestion_api.py -v

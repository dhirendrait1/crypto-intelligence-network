name: CIN Frontend CI

on:
  push:
    branches:
      - test/cin-step23-sqlite-persistence-reliability
    paths:
      - "frontend/**"
      - ".github/workflows/cin-frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/cin-frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck, tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  coinbase-backend:
    name: Coinbase adapter and API offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi
      - name: Compile Coinbase adapter, API and tests
        run: |
          python -m py_compile cin_coinbase_public_market_data.py
          python -m py_compile cin_coinbase_market_data_api.py
          python -m py_compile tests/test_cin_coinbase_public_market_data.py
          python -m py_compile tests/test_cin_coinbase_market_data_api.py
      - name: Run Coinbase backend contract tests
        run: |
          python -m unittest discover -s tests -p 'test_cin_coinbase_*.py' -v

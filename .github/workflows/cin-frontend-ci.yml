name: CIN Frontend CI

on:
  push:
    branches:
      - test/cin-step23-sqlite-persistence-reliability
    paths:
      - "frontend/**"
      - ".github/workflows/cin-frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/cin-frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck, tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

name: CIN Alert Reliability Tests

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "cin_alert_*.py"
      - "tests/test_cin_alert_*.py"
      - ".github/workflows/cin-alert-reliability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alert-tests:
    name: Offline alert state and worker regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile alert modules and tests
        run: |
          python -m compileall -q cin_alert_rules.py cin_alert_state.py cin_alert_delivery_outbox.py cin_alert_telegram_delivery.py cin_alert_telegram_worker.py
          python -m compileall -q tests
      - name: Run alert reliability tests only
        run: |
          python -m pytest -q \
            tests/test_cin_alert_rules.py \
            tests/test_cin_alert_state.py \
            tests/test_cin_alert_delivery_outbox.py \
            tests/test_cin_alert_telegram_delivery.py \
            tests/test_cin_alert_telegram_worker.py

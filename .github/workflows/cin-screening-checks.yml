name: CIN screening checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-screening:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependency
        run: python -m pip install "fastapi>=0.110,<1" pytest
      - name: Compile screening and ingestion modules
        run: python -m py_compile coin_screening_step2.py growth_fundamentals_assessment.py growth_fundamentals_api.py cin_evidence_ingestion.py cin_evidence_ingestion_api.py
      - name: Run offline screening tests
        run: python -m unittest discover -s tests -v
      - name: Run evidence assessment and ingestion tests
        run: python -m pytest -q tests/test_commodity_backing_assessment.py tests/test_commodity_backing_api.py tests/test_growth_fundamentals.py tests/test_growth_fundamentals_validation.py tests/test_growth_fundamentals_api.py tests/test_cin_public_news_sentiment.py tests/test_cin_evidence_ingestion.py

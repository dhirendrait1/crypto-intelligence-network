name: CIN Technical Analysis Tests

on:
  push:
    branches: [main, milestone-3-technical-analysis]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline technical analysis tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: python -m pip install "fastapi>=0.110,<1" "pydantic>=2,<3"
      - name: Compile and test
        run: |
          python -m py_compile cin_technical_analysis.py cin_technical_analysis_api.py tests/test_cin_technical_analysis.py
          python -m unittest tests/test_cin_technical_analysis.py -v

name: CIN Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate CIN scaffold
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract the same scaffold used by Render
        run: |
          unzip -q cin_step203_scaffold_fixed.zip
          test -d cin
          test -f cin/requirements.txt
          test -d cin/tests
          test -f patch_cin_metadata_fixed.py

      - name: Apply the read-only API router patch
        run: python patch_cin_metadata_fixed.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r cin/requirements.txt pytest

      - name: Run scaffold tests
        working-directory: cin
        run: python -m pytest -v tests

      - name: Run market-data regression tests
        working-directory: cin
        env:
          PYTHONPATH: ..
        run: python -m pytest -v ../tests/test_cin_market_candle_safety.py

      - name: Run derivatives market-data regression tests
        working-directory: cin
        env:
          PYTHONPATH: ..
        run: python -m pytest -v ../tests/test_cin_derivatives_market_data.py

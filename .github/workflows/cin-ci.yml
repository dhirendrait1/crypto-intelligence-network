name: CIN Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate CIN scaffold
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract scaffold archive
        run: |
          unzip -q cin_step203_bootable_scaffold.zip
          test -d cin
          test -f cin/requirements.txt
          test -d cin/tests

      - name: Install dependencies
        working-directory: cin
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Run automated tests
        working-directory: cin
        run: python -m pytest -v

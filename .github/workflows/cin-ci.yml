name: CIN Automated Tests

on:
  push:
    branches: [main, fix/deploy-scaffold-ci-alignment]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate Render deployment scaffold
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract the same scaffold used by Render
        run: |
          python -m zipfile -e cin_step203_scaffold_fixed.zip .
          test -d cin/app
          test -f cin/app/main.py
          test -f cin/requirements.txt

      - name: Apply the Render router and metadata patch
        run: python patch_cin_metadata_fixed.py

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cin/requirements.txt pytest httpx

      - name: Set up Node.js for Worker compatibility tests
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate D1 Worker JavaScript and SQL schema
        run: |
          node --check --input-type=module < worker/src/index.js
          node --test worker/test/*.test.js
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("worker/migrations/0001_forecast_ledger.sql").read_text())
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {"cin_forecasts", "cin_forecast_observations", "cin_forecast_evaluations"}
          assert required <= tables, required - tables
          PY

      - name: Compile CIN modules and tests
        run: |
          python -m compileall -q cin
          python -m compileall -q tests
          python -m py_compile cin_forecast_d1_adapter.py cin_forecast_ledger_api.py

      - name: Run offline test suite
        run: python -m pytest -q tests

      - name: Assert deployment routes are registered
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "cin")
          from app.main import app

          paths = {route.path for route in app.routes}
          required = {
              "/health",
              "/ready",
              "/market-data",
              "/coin-screening",
              "/market-candles",
              "/technical-analysis/market",
              "/technical-analysis",
              "/public-evidence-ingestion",
              "/commodity-backing-assessment",
              "/growth-fundamentals-assessment",
              "/derivatives/market-snapshot",
              "/news-sentiment",
              "/forecasts",
              "/forecasts/observations",
              "/forecasts/scorecards/summary",
          }
          missing = sorted(required - paths)
          print("Registered CIN routes:")
          for path in sorted(paths):
              print(f"  {path}")
          if missing:
              raise SystemExit(f"Missing required routes: {missing}")
          PY

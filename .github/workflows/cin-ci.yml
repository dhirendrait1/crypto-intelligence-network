name: CIN Automated Tests

on:
  push:
    branches: [main, fix/deploy-scaffold-ci-alignment]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate Render deployment scaffold
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preserve PR-only screening contract test before scaffold extraction
        run: |
          test -f tests/test_coin_screening_adapter_contract.py
          mkdir -p /tmp/cin-pr-contract-tests
          cp tests/test_coin_screening_adapter_contract.py /tmp/cin-pr-contract-tests/

      - name: Extract the same scaffold used by Render
        run: |
          python -m zipfile -e cin_step203_scaffold_fixed.zip .
          test -d cin/app
          test -f cin/app/main.py
          test -f cin/requirements.txt

      - name: Apply the Render router and metadata patch
        run: python patch_cin_metadata_fixed.py

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cin/requirements.txt pytest httpx

      - name: Restore PR-only screening contract test after scaffold extraction
        run: |
          mkdir -p tests
          cp /tmp/cin-pr-contract-tests/test_coin_screening_adapter_contract.py tests/

      - name: Compile CIN modules and tests
        run: |
          python -m compileall -q cin
          python -m compileall -q tests

      - name: Run offline test suite
        run: python -m pytest -q tests

      - name: Explicitly run screening adapter contract tests
        run: python -m pytest -q tests/test_coin_screening_adapter_contract.py

      - name: Assert deployment routes are registered
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "cin")
          from app.main import app

          paths = {route.path for route in app.routes}
          required = {
              "/health",
              "/ready",
              "/market-data",
              "/coin-screening",
              "/market-candles",
              "/technical-analysis/market",
              "/technical-analysis",
              "/public-evidence-ingestion",
              "/commodity-backing-assessment",
              "/growth-fundamentals-assessment",
              "/derivatives/market-snapshot",
              "/news-sentiment",
          }
          missing = sorted(required - paths)
          print("Registered CIN routes:")
          for path in sorted(paths):
              print(f"  {path}")
          if missing:
              raise SystemExit(f"Missing required routes: {missing}")
          PY
